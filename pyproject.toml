[project]
name = "ai-datacenters"
version = "0.1.0"
description = "Tracker for the largest AI datacenters, with on-demand Grok web-search updates"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_datacenters"]
